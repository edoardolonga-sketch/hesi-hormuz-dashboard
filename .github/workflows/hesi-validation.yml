name: HESI Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "scripts/**"
      - ".github/workflows/hesi-validation.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch EIA WPSR
        run: node scripts/fetch-eia-wpsr.mjs

      - name: Fetch Brent market data
        run: node scripts/fetch-brent.mjs

      - name: Fetch CFTC WTI positioning
        run: node scripts/fetch-cftc.mjs

      - name: Refresh observations
        run: node scripts/refresh-observations.mjs

      - name: Validate HESI data
        run: node scripts/update-hesi.mjs

      - name: Persist observations
        run: |
          if git diff --quiet -- data/latest-observations.json; then
            echo "No observation changes to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-observations.json
          git commit -m "Update latest observations"
          git push
