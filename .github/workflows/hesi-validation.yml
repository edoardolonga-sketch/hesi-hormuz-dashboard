name: HESI Validation

on:
  workflow_dispatch:

  schedule:
    - cron: "15 6 * * *"

  push:
    branches:
      - main
    paths:
      - "data/**"
      - "scripts/**"
      - ".github/workflows/hesi-validation.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch EIA WPSR
        run: node scripts/fetch-eia-wpsr.mjs

      - name: Fetch Brent market data
        run: node scripts/fetch-brent.mjs

      - name: Fetch CFTC WTI positioning
        run: node scripts/fetch-cftc.mjs

      - name: Refresh observations
        run: node scripts/refresh-observations.mjs

      - name: Import historical Brent to quarantine
        run: node scripts/import-historical-brent.mjs

      - name: Probe ALFRED Brent historical availability
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node scripts/probe-alfred-brent.mjs

      - name: Build ALFRED Brent admission candidates
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node scripts/build-alfred-brent-candidates.mjs

      - name: Validate historical admission
        run: node scripts/validate-historical-admission.mjs

      - name: Review ALFRED Brent methodology
        run: node scripts/review-alfred-brent-methodology.mjs

      - name: Prepare ALFRED Brent admission staging
        run: node scripts/prepare-alfred-brent-admission.mjs

      - name: Analyze ALFRED Brent availability
        run: node scripts/analyze-alfred-brent-availability.mjs

      - name: Document ALFRED availability methodology
        run: node scripts/document-alfred-methodology.mjs

      - name: Analyze ALFRED lag by year
        run: node scripts/analyze-alfred-lag-by-year.mjs

      - name: Analyze ALFRED weekday pattern
        run: node scripts/analyze-alfred-weekday-pattern.mjs

      - name: Build ALFRED admission decision gate
        run: node scripts/build-alfred-admission-decision.mjs

      - name: Record ALFRED methodology decision state
        run: node scripts/record-alfred-methodology-decision.mjs

      - name: Validate ALFRED human admission decision
        run: node scripts/validate-alfred-human-admission-decision.mjs

      - name: Analyze ALFRED admission overlap
        run: node scripts/analyze-alfred-admission-overlap.mjs

      - name: Validate ALFRED AvailableAt policy
        run: node scripts/validate-alfred-availableat-policy.mjs

      - name: Validate ALFRED point-in-time rule
        run: node scripts/validate-alfred-point-in-time.mjs

      - name: Admit approved ALFRED Brent history
        run: node scripts/admit-alfred-brent-history.mjs

      - name: Build leakage-safe historical dataset
        run: node scripts/build-historical-dataset.mjs

      - name: Build point-in-time backtest dataset
        run: node scripts/build-point-in-time-backtest.mjs

      - name: Analyze historical temporal coverage
        run: node scripts/analyze-historical-temporal-coverage.mjs

      - name: Compute experimental HESI
        run: node scripts/compute-hesi.mjs

      - name: Validate HESI data
        run: node scripts/update-hesi.mjs

      - name: Persist pipeline outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/latest-observations.json data/historical-observations.json data/historical-dataset.json data/point-in-time-backtest.json data/historical-temporal-coverage.json data/brent-historical-quarantine.json data/brent-alfred-candidates.json data/brent-alfred-methodology-review.json data/brent-alfred-admission-ready.json data/brent-alfred-availability-analysis.json data/brent-alfred-methodology-evidence.json data/brent-alfred-lag-by-year.json data/brent-alfred-weekday-pattern.json data/brent-alfred-admission-decision.json data/brent-alfred-methodology-decision.json data/brent-alfred-admission-overlap.json data/brent-alfred-availableat-policy-validation.json data/brent-alfred-point-in-time-validation.json data/historical-admission-report.json data/hesi-computed.json

          if git diff --cached --quiet; then
            echo "No pipeline output changes to persist."
            exit 0
          fi

          git commit -m "Update HESI pipeline outputs"
          git push
